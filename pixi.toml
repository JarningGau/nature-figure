[workspace]
authors = ["JarningGau <jarninggau@gmail.com>"]
channels = [
    "https://mirrors2.westlake.edu.cn/ANACONDA/cloud/conda-forge", 
    "https://mirrors2.westlake.edu.cn/ANACONDA/cloud/bioconda"
]
name = "nature-figure"
platforms = ["linux-64"]
version = "0.1.0"

[tasks.init]
cmd = "bash env/setup-vscode.sh"
default-environment = "default"

[feature.r.dependencies]
r-base = "==4.5.3"
r-languageserver = ">=0.3.17,<0.4"
r-ggplot2 = ">=4.0.2,<5"
r-qs = ">=0.27.3,<0.28"
r-tidyverse = ">=2.0.0,<3"
r-ggsci = ">=5.2.0,<6"
r-extrafont = ">=0.20,<0.21"

[feature.py.dependencies]
python = ">=3.12,<3.13"
matplotlib = ">=3.9,<4"
numpy = ">=2.1,<3"
seaborn = ">=0.13,<0.14"

[environments]
default = ["r", "py"]

[dependencies]
r-svglite = ">=2.2.2,<3"
r-rsvg = ">=2.6.1,<3"
pandas = ">=3.0.5,<4"
